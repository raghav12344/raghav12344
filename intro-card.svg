<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Raghav Gupta - Full-Stack, ML and AI Developer, B.Tech CSE at MNNIT Allahabad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1b1236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#ff7eb6"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Courier New', Consolas, monospace; }

    .dot { animation: float 6s ease-in-out infinite; }
    .d2 { animation-duration: 8s; animation-delay: -2s; }
    .d3 { animation-duration: 7s; animation-delay: -4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: .25; }
      50% { transform: translateY(-14px); opacity: .6; }
    }

    .runner { stroke-dasharray: 260 2200; animation: run 6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -2460; } }

    .pulse { transform-origin: 120px 160px; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: .7; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    .rise { opacity: 0; animation: rise .9s ease-out forwards; }
    .r1 { animation-delay: .2s; }
    .r2 { animation-delay: .5s; }
    .r3 { animation-delay: 1.9s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .role { opacity: 0; animation: cycle 12s infinite; }
    .ro1 { animation-delay: 0s; }
    .ro2 { animation-delay: 3s; }
    .ro3 { animation-delay: 6s; }
    .ro4 { animation-delay: 9s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      4% { opacity: 1; transform: translateY(0); }
      21% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }

    .chip { opacity: 0; animation: pop .6s ease-out forwards; }
    .c1 { animation-delay: 1.2s; }
    .c2 { animation-delay: 1.35s; }
    .c3 { animation-delay: 1.5s; }
    .c4 { animation-delay: 1.65s; }
    .c5 { animation-delay: 1.8s; }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Card background and border -->
  <rect x="2" y="2" width="896" height="316" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="316" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect class="runner" x="2" y="2" width="896" height="316" rx="20" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating background dots -->
  <circle class="dot" cx="760" cy="60" r="5" fill="#36BCF7"/>
  <circle class="dot d2" cx="830" cy="140" r="3.5" fill="#a371f7"/>
  <circle class="dot d3" cx="700" cy="250" r="4" fill="#ff7eb6"/>
  <circle class="dot d2" cx="850" cy="260" r="6" fill="#36BCF7"/>
  <circle class="dot" cx="640" cy="40" r="3" fill="#a371f7"/>

  <!-- Avatar -->
  <circle class="pulse" cx="120" cy="160" r="62" fill="none" stroke="#36BCF7" stroke-width="2"/>
  <circle cx="120" cy="160" r="62" fill="url(#avatar)"/>
  <text x="120" y="176" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff">RG</text>

  <!-- Text -->
  <text class="rise r1 mono" x="230" y="82" font-size="15" fill="#36BCF7" letter-spacing="3">HELLO WORLD, I'M</text>
  <text class="rise r2" x="230" y="138" font-size="48" font-weight="700" fill="url(#accent)">Raghav Gupta</text>

  <!-- Rotating roles -->
  <g class="mono" font-size="22" fill="#e6edf3">
    <text class="role ro1" x="230" y="182">&gt; Full-Stack Developer<tspan class="cursor" fill="#36BCF7">_</tspan></text>
    <text class="role ro2" x="230" y="182">&gt; ML / AI Engineer<tspan class="cursor" fill="#36BCF7">_</tspan></text>
    <text class="role ro3" x="230" y="182">&gt; RAG &amp; LLM App Builder<tspan class="cursor" fill="#36BCF7">_</tspan></text>
    <text class="role ro4" x="230" y="182">&gt; Java &amp; MERN Developer<tspan class="cursor" fill="#36BCF7">_</tspan></text>
  </g>

  <text class="rise r3" x="230" y="222" font-size="16" fill="#8b949e">B.Tech CSE  ·  MNNIT Allahabad</text>

  <!-- Chips -->
  <g class="mono" font-size="13" fill="#e6edf3" text-anchor="middle">
    <g class="chip c1"><rect x="230" y="244" width="104" height="30" rx="15" fill="#21262d" stroke="#36BCF7" stroke-opacity=".5"/><text x="282" y="264">Full-Stack</text></g>
    <g class="chip c2"><rect x="346" y="244" width="56" height="30" rx="15" fill="#21262d" stroke="#a371f7" stroke-opacity=".5"/><text x="374" y="264">Java</text></g>
    <g class="chip c3"><rect x="414" y="244" width="56" height="30" rx="15" fill="#21262d" stroke="#ff7eb6" stroke-opacity=".5"/><text x="442" y="264">MERN</text></g>
    <g class="chip c4"><rect x="482" y="244" width="80" height="30" rx="15" fill="#21262d" stroke="#36BCF7" stroke-opacity=".5"/><text x="522" y="264">ML / AI</text></g>
    <g class="chip c5"><rect x="574" y="244" width="104" height="30" rx="15" fill="#21262d" stroke="#a371f7" stroke-opacity=".5"/><text x="626" y="264">RAG &amp; LLMs</text></g>
  </g>
</svg>
